name: Feature
description: A new capability.
labels: [feature, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should we build?
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria.
